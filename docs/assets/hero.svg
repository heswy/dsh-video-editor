<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">dsh-video-editor — From conversation to creation</title><desc id="desc">An illustrated video workspace with a mountain scene, conversation and blue video and green audio tracks. Product illustration, not a screenshot.</desc>
