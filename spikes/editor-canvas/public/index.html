<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3-005-B 画布直接编辑试验页（非 DSH）</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/canvas.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>Vedio Editor · 画布试验页</strong>
    <span class="muted">独立试验页，不是 DSH 真机；数据来自受控 worker 预览快照</span>
  </div>
  <div class="statusline">
    <span id="status" class="status">启动中…</span>
    <span id="engine-meta" class="muted mono"></span>
  </div>
</header>

<main class="workspace">
  <section class="canvas-pane">
    <div class="canvas-tools">
      <div class="group">
        <button id="btn-play" type="button">播放</button>
        <button id="btn-pause" type="button">暂停</button>
        <label class="timecode mono" for="seek-range"><span id="time-label">0.000s</span> / <span id="duration-label">0.000s</span></label>
      </div>
      <input id="seek-range" class="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="定位时间">
      <div class="group muted">
        <span>试验尺寸</span>
        <button data-stage="1280x720" type="button">1280×720</button>
        <button data-stage="1100x700" type="button">1100×700</button>
        <button data-stage="760x640" type="button">760×640</button>
      </div>
    </div>

    <div id="stage" class="stage">
      <div id="preview-transform" class="preview-transform">
        <div id="frame-layer" class="frame-layer"></div>
      </div>
      <div id="overlay-layer" class="overlay-layer">
        <div id="selection" class="selection hidden">
          <span class="selection-label" id="selection-label"></span>
          <div class="handle handle-nw" data-handle="nw"></div>
          <div class="handle handle-ne" data-handle="ne"></div>
          <div class="handle handle-se" data-handle="se"></div>
          <div class="handle handle-sw" data-handle="sw"></div>
        </div>
        <div id="floatbar" class="floatbar hidden"></div>
        <div id="text-editor" class="text-editor hidden" contenteditable="true" spellcheck="false"></div>
        <div id="drag-hint" class="drag-hint hidden"></div>
      </div>
    </div>

    <div class="worknote" id="worknote">
      <span>单击选中 · 双击文字原位编辑 · Enter 提交 / Esc 恢复</span>
      <span class="muted">拖动/缩放为<strong>暂态</strong>演示，当前引擎无持久化接口</span>
    </div>
  </section>

  <aside class="side-pane">
    <details open>
      <summary>会话 / 修订</summary>
      <dl id="session-info" class="info"></dl>
    </details>
    <details>
      <summary>选择 / 命中</summary>
      <pre id="hit-info" class="pre">未选择</pre>
    </details>
    <details>
      <summary>能力缺口（拖动/缩放）</summary>
      <pre id="gap-info" class="pre">未尝试</pre>
    </details>
    <details>
      <summary>消息 / 生命周期诊断</summary>
      <pre id="diag-info" class="pre"></pre>
    </details>
    <div id="error-banner" class="error-banner hidden" role="alert"></div>
  </aside>
</main>
</body>
</html>
