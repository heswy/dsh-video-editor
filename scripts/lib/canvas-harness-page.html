<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P3-008 CanvasWorkspace harness</title>
<link rel="stylesheet" href="/harness/staged.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0d; }
  #root { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  /* Test-page overrides only: keep geometry stable (the real panel animation
     would translate the stage for its first 160ms) and force exact letterbox
     wrapper sizes so the component's own measured scale is deterministic. */
  .dv-root { animation: none !important; }
  /* The staged bundle's legacy workspace also styles the shared `.dv-stage`
     class (flex:1 + padding). The canvas component expects its own inline
     display width/height to win, so the test page neutralises that collision;
     otherwise the letterbox scale would not map 1:1 to the rendered stage. */
  .dv-stage { flex: none !important; padding: 0 !important; }
  .dv-canvas-wrap {
    flex: none !important;
    width: var(--harness-wrap-w, 900px) !important;
    height: var(--harness-wrap-h, 400px) !important;
    border: 0 !important;
    border-radius: 0 !important;
  }
</style>
</head>
<body>
<div id="root"><div class="dv-root"></div></div>
<script src="/harness/react-dom-lite.js"></script>
<script src="/harness/canvas-module.js"></script>
<script src="/harness/page.js"></script>
</body>
</html>
